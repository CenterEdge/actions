name: nuget-version
description: Generates NuGet package versions from release tags and run metadata

inputs:
  tag-prefix:
    description: Regex matched at the start of release tags; script adds ^ automatically (for example, [vV] or release/)
    required: false
    default: ''

outputs:
  version:
    description: The version number to apply to the package
    value: ${{ steps.resolve.outputs.version }}
  is-release:
    description: True when the current build is for a matching release tag
    value: ${{ steps.resolve.outputs.is-release }}

runs:
  using: composite
  steps:

  - name: Resolve NuGet package version
    id: resolve
    shell: bash
    run: |
      output=$(bash "${{ github.action_path }}/scripts/resolve-version.sh" '${{ inputs.tag-prefix }}')
      printf '%s\n' "$output" | tee -a "$GITHUB_OUTPUT"
    env:
      NUGET_VERSION_REF_TYPE: ${{ github.ref_type }}
      NUGET_VERSION_REF_NAME: ${{ github.ref_name }}
      NUGET_VERSION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      NUGET_VERSION_RUN_NUMBER: ${{ github.run_number }}
